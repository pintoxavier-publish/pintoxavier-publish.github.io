```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Pinto Xavier"
    >

    <title>Pinto Xavier</title>


    <style>

        /* ==================================================
           BASIC RESET
           ================================================== */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #ffffff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            color: #222222;
        }


        /* ==================================================
           INTRO SCREEN
           ================================================== */

        #intro {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background: #ffffff;

            z-index: 100;

            display: flex;

            align-items: center;
            justify-content: center;

            opacity: 1;

            transition:
                opacity 1.6s
                cubic-bezier(.65, 0, .35, 1);

            pointer-events: auto;
        }


        /* ==================================================
           DOT FIELD
           ================================================== */

        #dotField {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            display: grid;

            grid-template-columns:
                repeat(42, 1fr);

            grid-template-rows:
                repeat(26, 1fr);

            padding:
                5vh 5vw;

            align-items: center;

            justify-items: center;
        }


        /* ==================================================
           INDIVIDUAL DOT

           Every dot uses exactly the same animation.

           NO animation-delay.
           NO random timing.
           ================================================== */

        .dot {

            width: 2px;
            height: 2px;

            border-radius: 50%;

            background: #d8d8d8;

            opacity: 0.35;

            animation:

                synchronizedBreathing

                3.2s

                ease-in-out

                infinite;
        }


        /* ==================================================
           SYNCHRONIZED BREATHING

           All dots breathe together.
           ================================================== */

        @keyframes synchronizedBreathing {

            0% {

                transform:
                    scale(0.65);

                opacity:
                    0.30;
            }


            50% {

                transform:
                    scale(1.70);

                opacity:
                    0.70;
            }


            100% {

                transform:
                    scale(0.65);

                opacity:
                    0.30;
            }

        }


        /* ==================================================
           IDENTITY SCREEN
           ================================================== */

        #identity {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background: #ffffff;

            z-index: 50;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            opacity: 0;

            pointer-events: none;

            transition:

                opacity

                1.8s

                cubic-bezier(.65, 0, .35, 1);
        }


        /* ==================================================
           GENERIC AVATAR
           ================================================== */

        .avatar {

            position: relative;

            width: 0;
            height: 0;

            border-radius: 50%;

            background: #f5f5f5;

            border:
                1px solid #dddddd;

            box-shadow:

                0 20px 60px
                rgba(0, 0, 0, 0.08);

            opacity: 0;

            transform:
                scale(0.55);

            overflow: hidden;

            transition:

                width
                1.2s
                cubic-bezier(.22, 1, .36, 1),

                height
                1.2s
                cubic-bezier(.22, 1, .36, 1),

                opacity
                1s
                ease,

                transform
                1.4s
                cubic-bezier(.22, 1, .36, 1);
        }


        /* ==================================================
           AVATAR HEAD
           ================================================== */

        .avatar::before {

            content: "";

            position: absolute;

            width: 31%;

            aspect-ratio: 1;

            left: 50%;

            top: 23%;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background: #bcbcbc;
        }


        /* ==================================================
           AVATAR BODY
           ================================================== */

        .avatar::after {

            content: "";

            position: absolute;

            width: 58%;

            height: 42%;

            left: 50%;

            bottom: 8%;

            transform:
                translateX(-50%);

            border-radius:
                50% 50% 35% 35%;

            background: #bcbcbc;
        }


        /* ==================================================
           NAME
           ================================================== */

        .name {

            margin-top: 0;

            font-size:
                clamp(34px, 6vw, 76px);

            line-height: 1;

            font-weight: 300;

            letter-spacing:
                0.08em;

            color: #222222;

            opacity: 0;

            transform:
                translateY(28px);

            transition:

                opacity
                1.2s
                ease,

                transform
                1.2s
                cubic-bezier(.22, 1, .36, 1);

            transition-delay:
                0.65s;
        }


        /* ==================================================
           SUBTITLE
           ================================================== */

        .subtitle {

            margin-top: 18px;

            font-size: 12px;

            line-height: 1;

            font-weight: 400;

            letter-spacing:
                0.35em;

            text-transform:
                uppercase;

            color: #999999;

            opacity: 0;

            transform:
                translateY(14px);

            transition:

                opacity
                1s
                ease,

                transform
                1s
                ease;

            transition-delay:
                1.1s;
        }


        /* ==================================================
           ACTIVE IDENTITY SCREEN
           ================================================== */

        #identity.active {

            opacity: 1;

            pointer-events: auto;
        }


        /* ==================================================
           AVATAR ACTIVE
           ================================================== */

        #identity.active .avatar {

            width: 150px;

            height: 150px;

            opacity: 1;

            transform:
                scale(1);
        }


        /* ==================================================
           NAME ACTIVE
           ================================================== */

        #identity.active .name {

            opacity: 1;

            transform:
                translateY(0);
        }


        /* ==================================================
           SUBTITLE ACTIVE
           ================================================== */

        #identity.active .subtitle {

            opacity: 1;

            transform:
                translateY(0);
        }


        /* ==================================================
           DESKTOP / LARGE SCREEN
           ================================================== */

        @media (min-width: 1200px) {

            #dotField {

                grid-template-columns:
                    repeat(50, 1fr);

                grid-template-rows:
                    repeat(30, 1fr);

                padding:
                    6vh 5vw;
            }

        }


        /* ==================================================
           MOBILE
           ================================================== */

        @media (max-width: 600px) {

            #dotField {

                grid-template-columns:
                    repeat(24, 1fr);

                grid-template-rows:
                    repeat(34, 1fr);

                padding:
                    5vh 5vw;
            }


            #identity.active .avatar {

                width: 120px;

                height: 120px;
            }


            .name {

                font-size:
                    clamp(30px, 10vw, 48px);

                letter-spacing:
                    0.05em;
            }


            .subtitle {

                font-size: 10px;

                letter-spacing:
                    0.25em;
            }

        }


        /* ==================================================
           REDUCED MOTION ACCESSIBILITY
           ================================================== */

        @media (prefers-reduced-motion: reduce) {

            .dot {

                animation:
                    none;

                opacity:
                    0.5;
            }

            #intro,
            #identity,
            .avatar,
            .name,
            .subtitle {

                transition:
                    none;
            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         INTRODUCTION
         ================================================== -->

    <section id="intro">

        <div id="dotField"></div>

    </section>



    <!-- ==================================================
         PINTO XAVIER IDENTITY
         ================================================== -->

    <section id="identity">

        <div
            class="avatar"
            aria-label="Generic profile avatar"
        ></div>


        <div class="name">

            Pinto Xavier

        </div>


        <div class="subtitle">

            Welcome

        </div>

    </section>



    <script>

        /* =================================================
           DOT FIELD SETTINGS
           ================================================= */

        const columns = 42;

        const rows = 26;

        const totalDots =
            columns * rows;


        /* =================================================
           DOT FIELD ELEMENT
           ================================================= */

        const dotField =
            document.getElementById(
                "dotField"
            );


        /* =================================================
           CREATE ALL DOTS

           Every dot is created at the same time.
           Every dot receives the same CSS animation.
           There are no individual delays.
           ================================================= */

        for (
            let i = 0;
            i < totalDots;
            i++
        ) {

            const dot =
                document.createElement(
                    "div"
                );

            dot.className =
                "dot";

            dotField.appendChild(
                dot
            );
        }


        /* =================================================
           MAIN ELEMENTS
           ================================================= */

        const intro =
            document.getElementById(
                "intro"
            );


        const identity =
            document.getElementById(
                "identity"
            );


        /* =================================================
           TIMELINE

           0 sec
           White screen + breathing dots

           3 sec
           Begin fading dots

           4.2 sec
           Identity reveal

           5.4 sec
           Avatar fully appears

           6 sec+
           Pinto Xavier appears
           ================================================= */


        window.setTimeout(

            function () {

                intro.style.opacity =
                    "0";

            },

            3000

        );


        window.setTimeout(

            function () {

                intro.style.pointerEvents =
                    "none";

                identity.classList.add(
                    "active"
                );

            },

            4200

        );

    </script>


</body>

</html>
```

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pinto Xavier</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       BREATHING DOTS
       ========================= */

    #intro {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: white;

      display: flex;
      align-items: center;
      justify-content: center;

      opacity: 1;
      transition: opacity 1.5s ease;
    }

    #dotField {
      position: absolute;
      inset: 0;

      display: grid;
      grid-template-columns: repeat(35, 1fr);
      grid-template-rows: repeat(22, 1fr);

      align-items: center;
      justify-items: center;

      padding: 5vh 5vw;
    }

    .dot {
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #d9d9d9;

      /*
       * IMPORTANT:
       * Every dot has exactly the same animation.
       * There are NO delays.
       */
      animation: breathe 3.2s ease-in-out infinite;
    }

    @keyframes breathe {
      0% {
        transform: scale(0.7);
        opacity: 0.35;
      }

      50% {
        transform: scale(1.8);
        opacity: 0.75;
      }

      100% {
        transform: scale(0.7);
        opacity: 0.35;
      }
    }

    /* =========================
       GOOGLE 3D MAP
       ========================= */

    #mapContainer {
      position: fixed;
      inset: 0;
      z-index: 5;

      opacity: 0;

      transition: opacity 2s ease;
    }

    gmp-map-3d {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* =========================
       PINTO PROFILE
       ========================= */

    #profile {
      position: fixed;
      inset: 0;
      z-index: 30;

      background: white;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      opacity: 0;
      pointer-events: none;

      transition: opacity 2s ease;
    }

    .avatar {
      width: 150px;
      height: 150px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 50% 35%,
          #d8d8d8 0 20%,
          transparent 21%
        ),
        radial-gradient(
          ellipse at 50% 80%,
          #d8d8d8 0 35%,
          transparent 36%
        ),
        #f3f3f3;

      border: 1px solid #dddddd;

      box-shadow:
        0 10px 40px rgba(0,0,0,0.08);

      margin-bottom: 28px;
    }

    .name {
      font-size: clamp(32px, 6vw, 72px);
      font-weight: 300;
      letter-spacing: 0.08em;
      color: #222;
    }

    .subtitle {
      margin-top: 12px;

      font-size: 14px;
      letter-spacing: 0.25em;
      text-transform: uppercase;

      color: #999;
    }

    /* Mobile */

    @media (max-width: 600px) {

      #dotField {
        grid-template-columns: repeat(20, 1fr);
        grid-template-rows: repeat(30, 1fr);
      }

      .avatar {
        width: 120px;
        height: 120px;
      }

      .subtitle {
        font-size: 11px;
      }
    }

  </style>
</head>


<body>

  <!-- =========================
       INITIAL WHITE / DOT FIELD
       ========================= -->

  <div id="intro">
    <div id="dotField"></div>
  </div>


  <!-- =========================
       GOOGLE 3D MAP
       ========================= -->

  <div id="mapContainer">

    <gmp-map-3d
      id="map3d"
      mode="SATELLITE"
      center="9.45,76.52,1000"
      range="500000"
      tilt="0"
      heading="0"
      default-ui-hidden>
    </gmp-map-3d>

  </div>


  <!-- =========================
       PINTO XAVIER
       ========================= -->

  <div id="profile">

    <div class="avatar"></div>

    <div class="name">
      Pinto Xavier
    </div>

    <div class="subtitle">
      Welcome
    </div>

  </div>


  <!--
    Google Maps JavaScript API

    Replace YOUR_GOOGLE_MAPS_API_KEY
    with your actual Google Maps API key.
  -->

  <script
    async
    src="https://maps.googleapis.com/maps/api/js?loading=async&key=YOUR_GOOGLE_MAPS_API_KEY&libraries=maps3d">
  </script>


  <script>

    /* =====================================
       CREATE DOT FIELD
       ===================================== */

    const dotField = document.getElementById("dotField");

    const dotCount = 35 * 22;

    for (let i = 0; i < dotCount; i++) {

      const dot = document.createElement("div");

      dot.className = "dot";

      dotField.appendChild(dot);
    }


    /* =====================================
       ELEMENTS
       ===================================== */

    const intro = document.getElementById("intro");

    const mapContainer =
      document.getElementById("mapContainer");

    const map =
      document.getElementById("map3d");

    const profile =
      document.getElementById("profile");


    /* =====================================
       KUTTANAD
       Approximate central location
       ===================================== */

    const KUTTANAD = {
      lat: 9.45,
      lng: 76.52
    };


    /* =====================================
       START SEQUENCE
       ===================================== */

    async function startExperience() {

      /*
       * Wait until Google Maps is available.
       */

      await customElements.whenDefined("gmp-map-3d");


      /*
       * FIRST 3 SECONDS:
       *
       * White background + synchronized
       * breathing dots.
       */

      await wait(3000);


      /*
       * Fade dots away.
       */

      intro.style.opacity = "0";


      /*
       * Reveal the real 3D Earth.
       */

      mapContainer.style.opacity = "1";


      /*
       * Give the map a moment to render.
       */

      await wait(1200);


      /*
       * START FROM VERY HIGH ALTITUDE
       *
       * This gives the feeling of coming
       * down from space.
       */

      map.center = {
        lat: 9.45,
        lng: 76.52,
        altitude: 1000
      };

      map.range = 500000;

      map.tilt = 0;

      map.heading = 0;


      /*
       * CAMERA FLIGHT
       *
       * Google moves the camera toward
       * Kuttanad.
       */

      map.flyCameraTo({

        endCamera: {

          center: {
            lat: KUTTANAD.lat,
            lng: KUTTANAD.lng,
            altitude: 100
          },

          range: 12000,

          tilt: 67,

          heading: 20,

          roll: 0
        },

        durationMillis: 12000

      });


      /*
       * Wait for the camera flight.
       */

      await wait(12000);


      /*
       * HOLD KUTTANAD FOR 3 SECONDS.
       */

      await wait(3000);


      /*
       * Fade the map away.
       */

      mapContainer.style.opacity = "0";


      await wait(1800);


      /*
       * Show Pinto Xavier.
       */

      profile.style.opacity = "1";

      profile.style.pointerEvents = "auto";

    }


    /* =====================================
       SIMPLE WAIT FUNCTION
       ===================================== */

    function wait(ms) {

      return new Promise(resolve => {
        setTimeout(resolve, ms);
      });

    }


    /* =====================================
       START
       ===================================== */

    startExperience();

  </script>

</body>
</html>

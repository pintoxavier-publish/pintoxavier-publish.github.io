<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Pinto Xavier</title>


<style>

/* =========================================================
   RESET
   ========================================================= */

* {
    box-sizing: border-box;
}


html,
body {

    width: 100%;
    height: 100%;

    margin: 0;

    overflow: hidden;

    background: #000;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
}


/* =========================================================
   BREATHING WORLD
   ========================================================= */

#breathing-screen {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 100;

    opacity: 1;

    transition:
        opacity 3s
        cubic-bezier(.65, 0, .35, 1);
}


/* =========================================================
   DOT ARRAY
   ========================================================= */

#dot-array {

    position: absolute;

    inset: 0;

    display: grid;

    grid-template-columns:
        repeat(45, 1fr);

    grid-template-rows:
        repeat(28, 1fr);

    padding:
        10vh 8vw;

    align-items: center;

    justify-items: center;

    /*
       THE WHOLE ARRAY BREATHES AS ONE.

       We animate the container,
       not individual dots.
    */

    transform-origin: center center;

    animation:
        array-breathe
        8s
        ease-in-out
        infinite;
}


/* =========================================================
   TINY WHITE DOTS
   ========================================================= */

.dot {

    width: 1.5px;
    height: 1.5px;

    border-radius: 50%;

    background: rgba(255,255,255,0.58);

    /*
       Dots themselves DO NOT animate.
       The parent array does.
    */
}


/* =========================================================
   SLOW BREATHING

   One complete breath = 8 seconds.

   The whole field expands/contracts together.
   ========================================================= */

@keyframes array-breathe {

    0% {

        transform:
            scale(0.985);

        opacity:
            0.55;
    }


    50% {

        transform:
            scale(1.015);

        opacity:
            0.95;
    }


    100% {

        transform:
            scale(0.985);

        opacity:
            0.55;
    }

}


/* =========================================================
   IDENTITY SCREEN
   ========================================================= */

#identity {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background: #000;

    z-index: 50;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 3s
        cubic-bezier(.65, 0, .35, 1);
}


/* =========================================================
   AVATAR
   ========================================================= */

.avatar {

    position: relative;

    width: 130px;
    height: 130px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 50% 35%,
            #bdbdbd 0 18%,
            transparent 19%
        ),

        radial-gradient(
            ellipse at 50% 82%,
            #bdbdbd 0 34%,
            transparent 35%
        ),

        #111;

    border:
        1px solid
        rgba(255,255,255,0.18);

    box-shadow:

        0 0 60px
        rgba(255,255,255,0.04);

    opacity: 0;

    transform:
        scale(0.8)
        translateY(20px);

    transition:

        opacity 2s ease,

        transform 2.5s
        cubic-bezier(.22, 1, .36, 1);
}


/* =========================================================
   NAME
   ========================================================= */

.name {

    margin-top: 35px;

    color: #fff;

    font-size:
        clamp(36px, 6vw, 78px);

    font-weight: 300;

    letter-spacing:
        0.08em;

    opacity: 0;

    transform:
        translateY(25px);

    transition:

        opacity 2.2s ease,

        transform 2.2s
        cubic-bezier(.22, 1, .36, 1);

    transition-delay:
        0.6s;
}


/* =========================================================
   WELCOME
   ========================================================= */

.subtitle {

    margin-top: 18px;

    color:
        rgba(255,255,255,0.45);

    font-size: 11px;

    letter-spacing:
        0.45em;

    text-transform:
        uppercase;

    opacity: 0;

    transform:
        translateY(12px);

    transition:

        opacity 2s ease,

        transform 2s ease;

    transition-delay:
        1.4s;
}


/* =========================================================
   ACTIVE IDENTITY
   ========================================================= */

#identity.active {

    opacity: 1;

    pointer-events: auto;
}


/* =========================================================
   AVATAR REVEAL
   ========================================================= */

#identity.active .avatar {

    opacity: 1;

    transform:
        scale(1)
        translateY(0);
}


/* =========================================================
   NAME REVEAL
   ========================================================= */

#identity.active .name {

    opacity: 1;

    transform:
        translateY(0);
}


/* =========================================================
   SUBTITLE REVEAL
   ========================================================= */

#identity.active .subtitle {

    opacity: 1;

    transform:
        translateY(0);
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

    #dot-array {

        grid-template-columns:
            repeat(25, 1fr);

        grid-template-rows:
            repeat(36, 1fr);

        padding:
            8vh 7vw;
    }


    .dot {

        width: 1.4px;
        height: 1.4px;
    }


    .avatar {

        width: 110px;
        height: 110px;
    }


    .name {

        font-size:
            clamp(30px, 10vw, 50px);

        letter-spacing:
            0.04em;
    }

}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media (prefers-reduced-motion: reduce) {

    #dot-array {

        animation:
            none;
    }

    #breathing-screen,
    #identity,
    .avatar,
    .name,
    .subtitle {

        transition:
            none;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     BREATHING ARRAY
     ======================================================= -->

<div id="breathing-screen">

    <div id="dot-array"></div>

</div>



<!-- =======================================================
     PINTO XAVIER
     ======================================================= -->

<div id="identity">

    <div class="avatar"></div>

    <div class="name">
        Pinto Xavier
    </div>

    <div class="subtitle">
        Welcome
    </div>

</div>



<script>

/* =========================================================
   CREATE DOT ARRAY
   ========================================================= */

const dotArray =
    document.getElementById(
        "dot-array"
    );


const columns = 45;
const rows = 28;

const totalDots =
    columns * rows;


/* =========================================================
   CREATE DOTS
   ========================================================= */

for (
    let i = 0;
    i < totalDots;
    i++
) {

    const dot =
        document.createElement(
            "div"
        );

    dot.className =
        "dot";

    dotArray.appendChild(
        dot
    );

}


/* =========================================================
   ELEMENTS
   ========================================================= */

const breathingScreen =
    document.getElementById(
        "breathing-screen"
    );


const identity =
    document.getElementById(
        "identity"
    );


/* =========================================================
   TIMELINE

   0 – 8 seconds
   Slow breathing array

   8 seconds
   Begin fade

   11 seconds
   Pinto Xavier begins appearing

   The transition is intentionally slow.
   ========================================================= */


/*
   Let the breathing continue
   for a while before changing.
*/

setTimeout(

    () => {

        breathingScreen.style.opacity =
            "0";

    },

    8000

);


/*
   Reveal identity after
   the breathing surface has
   almost disappeared.
*/

setTimeout(

    () => {

        breathingScreen.style.pointerEvents =
            "none";

        identity.classList.add(
            "active"
        );

    },

    10500

);

</script>


</body>

</html>
